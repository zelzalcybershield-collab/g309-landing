name: Sync price

# Runs every 4h and scrapes the public amazon.eg product page for every product
# in products/*.json.
#
# On affiliate-account safety: the fetch URL is a bare /dp/<ASIN> link with no
# tracking tag, no credentials are used, and nothing is ever sent to Associates
# Central — so this cannot affect the affiliate account. What it *can* do is get
# blocked by Amazon for repeated requests from a datacenter IP, which would
# silently freeze the price. price.json keeps the last good value and flips
# `stale: true` in that case, so the page never shows a wrong or zero price.
#
# Products are fetched one after another on purpose. A matrix would run them in
# parallel, and every job would then race to git push the same branch.
on:
  schedule:
    # Minute 17, not 0 — the top of the hour is the busiest slot on all of
    # GitHub Actions and the queue is noticeably slower there.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update every product price
        env:
          AMZN_CLIENT_ID: ${{ secrets.AMZN_CLIENT_ID }}
          AMZN_CLIENT_SECRET: ${{ secrets.AMZN_CLIENT_SECRET }}
          AMZN_PARTNER_TAG: ${{ secrets.AMZN_PARTNER_TAG }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(products/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No products found — nothing to do."
            exit 0
          fi
          failed=0
          for f in "${files[@]}"; do
            slug=$(node -p "require('./$f').slug")
            asin=$(node -p "require('./$f').asin")
            dir=$(node -p "require('./$f').dir")
            echo "::group::$slug ($asin) -> ${dir:-.}price.json"
            if PRODUCT_DIR="$dir" ASIN="$asin" node scripts/update-price.mjs; then
              echo "  ok"
            else
              echo "  FAILED (keeping the last known price)" >&2
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
            sleep 8   # be gentle; one page per product is plenty for a 4h cadence
          done
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed product(s) could not be refreshed"
          fi

      - name: Rebuild the root index
        # The hub quotes whatever is in each price.json, so it has to be
        # regenerated after the prices change or it keeps showing old numbers.
        run: node build/hub.mjs

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'price.json' '*/price.json' 'index.html'
          if git diff --staged --quiet; then
            echo "No price change — nothing to commit."
          else
            git commit -m 'chore: sync prices'
            # Rebase first: Pages deploys and manual pushes can land between the
            # checkout and here, which makes a plain push get rejected.
            git pull --rebase --autostash origin main
            git push
          fi
