name: Sync price

# Automatic fetching is OFF on purpose.
#
# This repo used to run on a 4h cron scraping amazon.eg. It was stopped at the
# owner's request — the affiliate account is not involved in any way (the fetch
# URL carries no tracking tag and no credentials are used), but repeated
# automated requests to Amazon from a datacenter IP aren't worth the ambiguity.
#
# price.json is now edited by hand, one step at a time:
#   https://github.com/zelzalcybershield-collab/g309-landing/edit/main/price.json
#
# `workflow_dispatch` is kept for occasional one-off checks when you want one,
# knowing it is you pressing the button, not a schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch price and write price.json
        env:
          ASIN: ${{ vars.AMZN_ASIN }}
          AMZN_CLIENT_ID: ${{ secrets.AMZN_CLIENT_ID }}
          AMZN_CLIENT_SECRET: ${{ secrets.AMZN_CLIENT_SECRET }}
          AMZN_PARTNER_TAG: ${{ secrets.AMZN_PARTNER_TAG }}
        run: node scripts/update-price.mjs

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add price.json
          if git diff --staged --quiet; then
            echo "No price change — nothing to commit."
          else
            git commit -m 'chore: sync price.json'
            # Rebase first: Pages deploys and manual pushes can land between the
            # checkout and here, which makes a plain push get rejected.
            git pull --rebase --autostash origin main
            git push
          fi
